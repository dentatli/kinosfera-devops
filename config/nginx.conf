worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format metrics escape=json '{"method":"$request_method","path":"$uri","status":$status,"duration":$request_time,"protocol":"$server_protocol"}';
    access_log syslog:server=metrics:9514,nohostname,tag=kinosfera metrics;
    sendfile on;
    keepalive_timeout 65;
    proxy_cache_path /var/cache/nginx/long levels=1:2 keys_zone=long_dummy:10m max_size=50m inactive=2m;
    upstream api { server balancer:8080; keepalive 128; }
    server {
        listen 80;
        listen 443 ssl;
        listen 443 quic reuseport;
        http2 on;
        server_name kinosfera.test;
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_early_data off;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;
        proxy_next_upstream off;

        location = /long_dummy {
            proxy_pass http://api;
            proxy_cache long_dummy;
            proxy_cache_key "$request_method:$uri:$is_args$args";
            proxy_cache_valid 200 50s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_lock_age 5s;
            proxy_cache_background_update off;
            proxy_cache_use_stale off;
            add_header X-Cache $upstream_cache_status always;
            add_header Alt-Svc 'h3=":443"; ma=86400' always;
        }
        location / {
            proxy_pass http://api;
            proxy_cache off;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
