global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    timeout connect 1s
    timeout client 120s
    timeout server 120s
    timeout check 1s
    retries 2
    option redispatch

frontend api
    bind :8080
    use_backend bingo_read if { method GET HEAD }
    default_backend bingo

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s

backend bingo
    balance roundrobin
    option httpchk
    http-check send meth GET uri /ping ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server inter 1s fall 1 rise 1 resolvers docker init-addr libc,none resolve-prefer ipv4
    server app1 app1:16395 check
    server app2 app2:16395 check

backend bingo_read
    balance roundrobin
    option httpchk
    http-check send meth GET uri /ping ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    retry-on conn-failure empty-response response-timeout 500 502 503 504
    option redispatch 1
    default-server inter 1s fall 1 rise 1 resolvers docker init-addr libc,none resolve-prefer ipv4 observe layer7 on-error mark-down error-limit 1
    server app1 app1:16395 check
    server app2 app2:16395 check

frontend monitoring
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
